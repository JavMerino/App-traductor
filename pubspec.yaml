name: audio_traductor
description: "Traducción de voz en tiempo real para conferencias."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── ML Kit On-Device Translation ──
  google_mlkit_translation: ^0.13.1

  # ── HTTP (solo STT cloud, si se usa) ──
  http: ^1.6.0

  # ── Audio ──
  audio_session: ^0.1.25
  record: ^6.2.0
  just_audio: ^0.9.42
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # ── Local Storage ──
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Export ──
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # ── Bluetooth ──
  flutter_blue_plus: ^1.34.0

  # ── Connectivity ──
  connectivity_plus: ^6.1.4

  # ── Functional Programming ──
  dartz: ^0.10.1

  # ── Date / ID / Equality ──
  intl: ^0.19.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # ── UI ──
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1
  animated_icon: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
